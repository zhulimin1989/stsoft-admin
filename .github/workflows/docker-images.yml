name: Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag to publish in addition to test-latest"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: stsoft-lab
  IMAGE_TAG: ${{ inputs.tag || github.sha }}
  VITE_PLATFORM_CURRENCY: ${{ vars.TEST_VITE_PLATFORM_CURRENCY || vars.TEST_BILLING_PLATFORM_CURRENCY || vars.TEST_PLATFORM_CURRENCY || vars.TEST_BILLING_CURRENCY || 'usd' }}

jobs:
  build:
    name: Build and publish admin images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build admin-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          cache-from: type=gha,scope=admin-api
          cache-to: type=gha,mode=max,scope=admin-api
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/codesphere-admin-api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/codesphere-admin-api:test-latest

      - name: Build admin-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: |
            VITE_BASE=/
            VITE_PLATFORM_CURRENCY=${{ env.VITE_PLATFORM_CURRENCY }}
          cache-from: type=gha,scope=admin-web
          cache-to: type=gha,mode=max,scope=admin-web
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/codesphere-admin-web:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/codesphere-admin-web:test-latest
