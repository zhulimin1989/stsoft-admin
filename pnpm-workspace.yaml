packages:
  - 'apps/api'
  - 'apps/admin'
  - 'packages/shared'

nodeLinker: hoisted
injectWorkspacePackages: true

overrides:
  fastify: 5.8.4

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/cli': true
  bcrypt: true
  esbuild: true
  prisma: true
